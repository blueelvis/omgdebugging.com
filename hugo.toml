baseURL = "https://omgdebugging.com"
languageCode = "en-us"
title = "OMG Debugging"
enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[params]
  description = "A blog about technology, coding, finance and life tidbits"
  author = "Pranav"
  mainSections = ["technology", "coding", "finance", "life"]
  toc = true
  dateFormat = "January 2, 2006"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Technology"
    url = "/technology/"
    weight = 2
  [[menu.main]]
    name = "Coding"
    url = "/coding/"
    weight = 3
  [[menu.main]]
    name = "Finance"
    url = "/finance/"
    weight = 4
  [[menu.main]]
    name = "Life"
    url = "/life/"
    weight = 5
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 6
